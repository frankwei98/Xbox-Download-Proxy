services:
  xdp:
    build:
      context: .
      dockerfile: Dockerfile
    image: xdp:local
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./data:/data
      - ${DOWNLOAD_PATH:-./data/downloads}:/downloads
    command:
      - serve
      - --data-dir
      - /data
      - --lan-ip
      - ${LAN_IP:-192.168.1.10}
      - --web
      - :8080
      - --download-dir
      - /downloads
