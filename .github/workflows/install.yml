name: Installer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-install:
    name: Install on ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: alpine:3.22
            manager: openrc
          - image: alpine:3.23
            manager: openrc
            source: '1'
          - image: debian:12-slim
            manager: systemd
          - image: debian:13-slim
            manager: systemd
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false
      - name: Check shell scripts
        run: shellcheck setup.sh scripts/setup_test.sh scripts/install-service.sh scripts/setup_smoke_test.sh
      - name: Build static test binary
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/xdp" ./cmd/xdp
      - name: Test installer and service integration
        env:
          TEST_IMAGE: ${{ matrix.image }}
          TEST_MANAGER: ${{ matrix.manager }}
          XDP_TEST_SOURCE_BUILD: ${{ matrix.source }}
        run: |
          docker run --rm \
            --mount "type=bind,source=$PWD,target=/src,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/xdp,target=/test-xdp,readonly" \
            --env XDP_SETUP_TEST_CONTAINER=1 --env XDP_TEST_BINARY=/test-xdp \
            --env XDP_TEST_SOURCE_BUILD \
            --env TEST_MANAGER "$TEST_IMAGE" sh -ec '
              if [ "$TEST_MANAGER" = openrc ]; then
                apk add --no-cache openrc
              else
                apt-get update
                apt-get install -y --no-install-recommends systemd
              fi
              sh /src/scripts/setup_test.sh
              sh /src/scripts/setup_smoke_test.sh
            '
