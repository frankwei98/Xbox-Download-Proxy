name: Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build and package
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -o dist/xdp ./cmd/xdp
          tar -C dist -czf "xdp-${RELEASE_TAG}-${GOOS}-${GOARCH}.tar.gz" xdp
          sha256sum "xdp-${RELEASE_TAG}-${GOOS}-${GOARCH}.tar.gz" > "xdp-${RELEASE_TAG}-${GOOS}-${GOARCH}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xdp-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            xdp-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            xdp-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
          if-no-files-found: error
