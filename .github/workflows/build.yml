name: Build

on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Test Go with race detection and coverage
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Vet Go
        run: go vet ./...

      - name: Test frontend logic and check JavaScript syntax
        run: |
          make test-ui
          node --check internal/app/web/app.js

      - name: Test installer mocks
        run: make test-setup

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          if-no-files-found: error

  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -o dist/xdp ./cmd/xdp

      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tar -C dist -czf "xdp-${RELEASE_TAG}-${GOOS}-${GOARCH}.tar.gz" xdp
          sha256sum "xdp-${RELEASE_TAG}-${GOOS}-${GOARCH}.tar.gz" > "xdp-${RELEASE_TAG}-${GOOS}-${GOARCH}.tar.gz.sha256"

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: xdp-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            xdp-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            xdp-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: xdp-${{ github.ref_name }}-*
          merge-multiple: true
          path: release

      - name: Verify packages and publish release
        shell: bash
        run: |
          set -euo pipefail
          cd release
          for os in linux darwin; do
            for arch in amd64 arm64; do
              package="xdp-${RELEASE_TAG}-${os}-${arch}.tar.gz"
              checksum="${package}.sha256"
              test -f "$package"
              test -f "$checksum"
            done
          done
          sha256sum -c ./*.sha256

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.tar.gz ./*.sha256 --repo "$GH_REPO" --clobber
          else
            gh release create "$RELEASE_TAG" ./*.tar.gz ./*.sha256 \
              --repo "$GH_REPO" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
